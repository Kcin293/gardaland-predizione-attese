services:
  db:
    image: postgres:16
    container_name: gardaland-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gardaland}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gardaland_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gardaland}"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: gardaland-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gardaland}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

volumes:
  gardaland_pgdata:
